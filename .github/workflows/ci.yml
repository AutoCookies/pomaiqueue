name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DPOMAIQ_BUILD_SERVER=ON
      - name: Build
        run: cmake --build build --parallel

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DPOMAIQ_BUILD_SERVER=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure -R "test_"

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DPOMAIQ_BUILD_SERVER=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure -R "integration"

  crash-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DPOMAIQ_BUILD_SERVER=ON
      - run: cmake --build build --parallel --target crash_runner
      - run: ./build/crash_runner 2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build

  artifact:
    runs-on: ubuntu-latest
    needs: [build, unit-tests, integration-tests, crash-tests, lint]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DPOMAIQ_BUILD_SERVER=ON
      - run: cmake --build build --parallel --target pomaiqueue-server pomaiqctl
      - run: |
          mkdir -p release/pomaiqueue/bin release/pomaiqueue/docs
          cp build/pomaiqueue-server release/pomaiqueue/bin/
          cp build/pomaiqctl release/pomaiqueue/bin/
          cp README.md docs/runbook.md release/pomaiqueue/docs/
          tar -czf pomaiqueue-${{ github.sha }}.tar.gz -C release pomaiqueue
          sha256sum pomaiqueue-${{ github.sha }}.tar.gz > pomaiqueue-${{ github.sha }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pomaiqueue-release
          path: |
            pomaiqueue-${{ github.sha }}.tar.gz
            pomaiqueue-${{ github.sha }}.tar.gz.sha256
